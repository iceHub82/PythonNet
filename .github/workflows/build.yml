name: build

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore PythonNetSolution.sln

      - run: dotnet build PythonNetSolution.sln -c Release --no-restore

      - run: dotnet test PythonNetSolution.sln -c Release --no-build --verbosity normal

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonNet.Python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: PythonNet.Python/requirements.txt

      - run: pip install -r requirements.txt pytest

      # Headless runner: the tests select the Agg backend themselves.
      - run: python -m pytest -q
